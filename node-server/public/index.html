<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JioTV Proxy | Premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ff4b4b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e50914;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
      JioTV Proxy
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search channels..." autocomplete="off">
    </div>
    <div class="auth-section">
      <button id="loginBtn" class="btn" style="display:none;" onclick="openLoginModal()">Login with Jio</button>
      <div id="loggedInState" style="display:none; color: #fff; font-size: 0.9em; text-align: right;">
        <span style="color:#00e676">●</span> Logged In
      </div>
    </div>
  </header>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>JioTV Login</h2>
      <p style="color:#aaa; font-size:0.9em; margin-bottom:15px;">Login required to unlock Premium & HD (DRM) channels.</p>
      
      <div id="step1">
        <input type="text" id="mobileNumber" placeholder="Jio Mobile Number (e.g., 9876543210)" class="input-field">
        <button class="btn" onclick="sendOtp()" id="sendOtpBtn" style="width: 100%; margin-top:10px;">Send OTP</button>
      </div>
      
      <div id="step2" style="display:none;">
        <input type="text" id="otpCode" placeholder="Enter OTP" class="input-field">
        <button class="btn" onclick="verifyOtp()" id="verifyOtpBtn" style="width: 100%; margin-top:10px;">Verify OTP</button>
      </div>

      <div id="loginMsg" style="margin-top: 15px; color: #ff4b4b; font-size: 0.9em;"></div>
      <button class="btn" style="background:transparent; color:#888; width:100%; margin-top:10px;" onclick="closeLoginModal()">Cancel</button>
    </div>
  </div>

  <main>
    <div class="category-filters" id="categoryFilters">
      <div class="filter-btn active" data-id="all">All Channels</div>
      <!-- Filters will be populated here -->
    </div>

    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>Loading 800+ Premium Channels...</p>
    </div>

    <div class="channels-grid" id="channelsGrid">
      <!-- Cards will be populated here -->
    </div>
  </main>

  <script>
    const LOGO_BASE_URL = 'https://jiotvimages.cdn.jio.com/dare_images/images/';
    const CATEGORIES = {
      1: 'Entertainment',
      2: 'Movies',
      3: 'Kids',
      4: 'Sports',
      5: 'Lifestyle',
      6: 'Infotainment',
      7: 'News',
      8: 'Music',
      9: 'Devotional',
      10: 'Business',
      11: 'Educational',
      12: 'Shopping',
      13: 'JioDarshan',
      14: 'Darshan'
    };

    let allChannels = [];
    let currentCategory = 'all';

    async function loadChannels() {
      try {
        const res = await fetch('/api/channels');
        const data = await res.json();
        allChannels = data.result || [];
        
        // Filter out hidden/cam channels if needed, but for now just show all
        allChannels = allChannels.filter(c => !c.isHidden);
        
        document.getElementById('loader').style.display = 'none';
        renderCategories();
        renderChannels();
      } catch (err) {
        document.getElementById('loader').innerHTML = `<p style="color:#ff4b4b">Failed to load channels. Please check backend.</p>`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      
      // Get unique category IDs from data
      const catIds = [...new Set(allChannels.map(c => c.channelCategoryId))].sort((a,b)=>a-b);
      
      catIds.forEach(id => {
        if (!CATEGORIES[id]) return;
        const btn = document.createElement('div');
        btn.className = 'filter-btn';
        btn.dataset.id = id;
        btn.innerText = CATEGORIES[id];
        btn.onclick = () => setCategory(id, btn);
        container.appendChild(btn);
      });

      // Bind 'All' button
      container.querySelector('[data-id="all"]').onclick = function() {
        setCategory('all', this);
      };
    }

    function setCategory(id, element) {
      currentCategory = id;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
      renderChannels();
    }

    function renderChannels() {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';
      
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = allChannels.filter(c => {
        const matchName = c.channel_name.toLowerCase().includes(query);
        const matchCat = currentCategory === 'all' || c.channelCategoryId == currentCategory;
        return matchName && matchCat;
      });

      filtered.forEach(c => {
        const card = document.createElement('a');
        card.className = 'channel-card';
        card.href = `/play.html?id=${c.channel_id}&name=${encodeURIComponent(c.channel_name)}`;
        
        const logoUrl = LOGO_BASE_URL + (c.logoUrl || 'default.png');
        
        let metaHtml = '';
        if (c.isHD) {
          metaHtml += `<span class="badge">HD</span>`;
        }
        if (CATEGORIES[c.channelCategoryId]) {
          metaHtml += `<span>${CATEGORIES[c.channelCategoryId]}</span>`;
        }

        card.innerHTML = `
          <div class="channel-logo-container">
            <img src="${logoUrl}" alt="${c.channel_name}" class="channel-logo" loading="lazy" onerror="this.src='https://jiotvimages.cdn.jio.com/dare_images/images/default.png'">
          </div>
          <div class="channel-name">${c.channel_name}</div>
          <div class="channel-meta">${metaHtml}</div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderChannels);

    // --- Authentication Logic ---
    function checkLoginState() {
      if (document.cookie.includes('jiotv_sess=')) {
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('loggedInState').style.display = 'block';
      } else {
        document.getElementById('loginBtn').style.display = 'block';
        document.getElementById('loggedInState').style.display = 'none';
      }
    }

    function openLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('step1').style.display = 'block';
      document.getElementById('step2').style.display = 'none';
      document.getElementById('loginMsg').textContent = '';
      document.getElementById('mobileNumber').value = '';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    async function sendOtp() {
      const number = document.getElementById('mobileNumber').value;
      if (!number || number.length < 10) return;
      document.getElementById('sendOtpBtn').textContent = 'Sending...';
      try {
        const res = await fetch('/api/login/send-otp', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ number })
        });
        const data = await res.json();
        if (data.message === 'SUCCESS') {
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
          document.getElementById('loginMsg').style.color = '#00e676';
          document.getElementById('loginMsg').textContent = 'OTP sent!';
        } else {
          document.getElementById('loginMsg').style.color = '#ff4b4b';
          document.getElementById('loginMsg').textContent = data.ui_label || data.message;
        }
      } catch (err) {
        document.getElementById('loginMsg').textContent = 'Network error';
      }
      document.getElementById('sendOtpBtn').textContent = 'Send OTP';
    }

    async function verifyOtp() {
      const number = document.getElementById('mobileNumber').value;
      const otp = document.getElementById('otpCode').value;
      if (!otp) return;
      document.getElementById('verifyOtpBtn').textContent = 'Verifying...';
      try {
        const res = await fetch('/api/login/verify-otp', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ number, otp })
        });
        const data = await res.json();
        if (data.sessionData) {
          closeLoginModal();
          checkLoginState();
        } else {
          document.getElementById('loginMsg').style.color = '#ff4b4b';
          document.getElementById('loginMsg').textContent = data.ui_label || data.message;
        }
      } catch (err) {
        document.getElementById('loginMsg').textContent = 'Network error';
      }
      document.getElementById('verifyOtpBtn').textContent = 'Verify OTP';
    }

    // Init
    checkLoginState();
    loadChannels();
  </script>
</body>
</html>
